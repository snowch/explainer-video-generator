<!doctype html>
<html class="{{STYLE_CLASS}}">
<head>
<meta charset="utf-8">
<title>frame</title>
<style>
{{FONTS_CSS}}
:root{
  --bg:#F5F7FB; --bg2:#E6ECF7; --ink:#16213A; --muted:#5B6578; --accent:#2F6FE4;
  --card:#FFFFFF; --hl:#E8590C; --border:rgba(22,33,58,.12);
  --font:'Inter',system-ui,sans-serif; --dfont:'Inter',system-ui,sans-serif;
}
html.sketch{
  --bg:#FBF6EA; --bg2:#F1E6CC; --ink:#1F1A14; --muted:#6E6356; --accent:#C2410C;
  --card:#FFFDF7; --hl:#D9480F; --border:rgba(31,26,20,.2);
  --dfont:'Caveat',cursive;
}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;
  background:radial-gradient(130% 100% at 15% 0%,var(--bg) 0%,var(--bg2) 100%)}
.frame{position:relative;width:1920px;height:1080px}
html.sketch .frame::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.28;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .25 0 0 0 0 .2 0 0 0 .45 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.topbar{position:absolute;left:84px;right:84px;top:58px;display:flex;justify-content:space-between;align-items:flex-start}
.kicker{font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.scene-title{font-size:44px;font-weight:700;margin-top:10px;font-family:var(--dfont);letter-spacing:-.01em}
html.sketch .scene-title{font-size:58px;margin-top:2px}
.chips{display:flex;gap:14px;align-items:center;margin-top:4px}
.chip{font-size:20px;color:var(--muted);border:1.5px solid var(--border);border-radius:999px;padding:9px 18px;background:rgba(255,255,255,.55)}
.chip b{color:var(--ink);font-weight:600}
.stage{position:absolute;left:150px;right:150px;top:200px;height:580px;display:flex;align-items:center;justify-content:center}
.stage svg{max-width:none!important;width:100%;height:100%}
.captionbar{position:absolute;left:84px;right:84px;bottom:76px;display:flex;align-items:center;gap:30px;
  background:var(--card);border:1.5px solid var(--border);border-radius:26px;padding:26px 34px 26px 28px;box-shadow:0 10px 36px rgba(0,0,0,.08)}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:38px;display:flex;align-items:center;justify-content:center;flex:none}
.caption{font-size:36px;line-height:1.32;font-weight:500;flex:1;min-height:2.64em}
.caption .w{transition:none}
.caption .name{color:var(--accent);font-weight:700;margin-right:14px}
.hosts{display:flex;gap:10px;align-items:center;flex:none;margin-left:16px}
.host{display:flex;align-items:center;gap:10px;font-size:20px;color:var(--muted);border:1.5px solid var(--border);border-radius:999px;padding:7px 16px 7px 8px}
.host .dot{width:34px;height:34px;border-radius:50%;background:var(--border);color:var(--ink);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center}
.host.active{color:var(--ink);border-color:var(--accent)}
.host.active .dot{background:var(--accent);color:#fff}
.bars{display:inline-flex;gap:3px;align-items:flex-end;height:18px;margin-left:2px}
.bars i{width:4px;background:var(--accent);border-radius:2px;height:var(--h,10px)}
.progress{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--border)}
.progress i{display:block;height:100%;width:{{PROGRESS}}%;background:var(--accent)}
/* diagram highlight: applied at render time to the node the current line refers to */
.is-highlighted > rect, .is-highlighted > polygon{stroke:var(--hl)!important;stroke-width:4px!important;fill:#FFE4D1!important}
.is-highlighted > g:not(.label) > path:last-child{stroke:var(--hl)!important;stroke-width:3px!important}
.is-highlighted > g:not(.label) > path:first-child{stroke:#F2A66B!important}
/* title scene */
.titlecard{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:34px;width:100%}
.titlecard .big{font-size:84px;line-height:1.12;font-weight:700;max-width:1400px;font-family:var(--dfont);letter-spacing:-.015em}
html.sketch .titlecard .big{font-size:104px}
.titlecard .rule{width:140px;height:8px;border-radius:4px;background:var(--accent)}
/* illustration scene */
.illus{display:flex;align-items:center;justify-content:center;gap:64px;width:100%}
.illus .pic{width:1000px;height:560px;border-radius:28px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.14);flex:none}
.illus .pic svg{width:100%;height:100%;display:block}
.illus .side{font-size:64px;line-height:1.15;font-weight:700;max-width:560px;font-family:var(--dfont)}
html.sketch .illus .side{font-size:80px}
.illus .tag{display:block;margin-top:22px;font-size:20px;font-family:var(--font);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <div><div class="kicker">{{CHAPTER}}</div><div class="scene-title">{{SCENE_TITLE}}</div></div>
    <div class="chips"><div class="chip">source <b>{{SOURCE}}</b></div></div>
  </div>
  <div class="stage" id="stage">{{STAGE_HTML}}</div>
  <div class="captionbar">
    <div class="avatar">{{SPEAKER_INITIAL}}</div>
    <div class="caption"><span class="name">{{SPEAKER_NAME}}</span><span id="caption-text">{{CAPTION}}</span></div>
    <div class="hosts">{{HOSTS_HTML}}</div>
  </div>
  <div class="progress"><i></i></div>
</div>
</body>
</html>
