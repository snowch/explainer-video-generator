# Example script: the contract between authoring (LLM draft + human edits) and
# production (TTS + render). Everything downstream is a pure function of this
# file, the diagram sources it references, and the book spans it cites.
#
# Illustrative content only. See docs/design.md for the schema rules.

version: 1
id: ch03-write-ahead-log
title: "Why a write-ahead log keeps your data safe"

source:
  document: book/ch03-durability.md
  # Spans are addressed as <doc-id>#<anchor>. Anchors are produced by the
  # ingest step: p<N> for paragraphs, fig-<id> for figures, h-<slug> for
  # headings, code-<N> for code blocks. Ranges like p7-p8 are allowed.

style:
  format: explainer          # explainer | brief
  target_minutes: 6
  theme: default             # Remotion theme: colours, fonts, transitions
  captions: true

hosts:
  A:
    name: Maya
    role: asks the questions a first-time reader would ask
    voice: elevenlabs:<voice-id-a>    # provider:voice-id
  B:
    name: Sam
    role: explains; stays inside the chapter; never speculates
    voice: elevenlabs:<voice-id-b>

pronunciation:               # project lexicon applied before synthesis
  fsync: "F-sync"
  WAL: "wall"

scenes:
  - id: hook
    visual:
      type: title
      text: "What happens to your data when the power goes out?"
    lines:
      - speaker: A
        kind: bridge          # conversational glue: no source required, no facts allowed
        text: "[curious] Okay, here's the thing I've never understood. I hit save, the lights go out. Is my data there or not?"
      - speaker: B
        kind: claim           # factual: must cite a span and pass the gate
        source: ch03-durability#p2
        text: "It depends on whether the write reached durable storage before the crash. That's the whole problem this chapter is about."

  - id: the-problem
    visual:
      type: diagram
      src: diagrams/ch03/buffer-vs-disk.mmd
      reveal: [app, buffer, disk]        # element ids revealed in this order
    lines:
      - speaker: B
        kind: claim
        source: ch03-durability#p4
        highlight: buffer                # glows while this line is spoken
        text: "Most databases keep recent changes in memory first, because writing every change straight to disk is slow."
      - speaker: A
        kind: bridge
        text: "So memory is fast, but it's the part that vanishes."
      - speaker: B
        kind: claim
        source: ch03-durability#p5
        highlight: disk
        text: "[measured] Right. Anything only in memory at crash time is gone. Anything that reached disk survives."

  - id: the-fix
    visual:
      type: diagram
      src: diagrams/ch03/wal-flow.excalidraw
      reveal: [write, log, ack, apply]
    lines:
      - speaker: B
        kind: claim
        source: ch03-durability#p7-p8
        highlight: log
        text: "The write-ahead log flips the order. Before the database touches its main data files, it appends a description of the change to a sequential log and forces that to disk."
      - speaker: A
        kind: question
        text: "Isn't that just doing the slow thing twice?"
      - speaker: B
        kind: claim
        source: ch03-durability#p9
        highlight: log
        text: "Appending to one sequential file is far cheaper than updating scattered pages. The expensive random writes can happen later, in batches."

  - id: book-figure
    visual:
      type: figure
      src: book/figures/fig-3-2-recovery.png    # the book's own figure, reused as-is
      caption: "Figure 3.2: replaying the log after a crash"
    lines:
      - speaker: B
        kind: claim
        source: ch03-durability#fig-3-2
        text: "On restart, the database replays the log from the last checkpoint, and the data files catch up to exactly where they were."

  - id: recap
    visual:
      type: recap
      points:
        - "Memory is fast but volatile; disk is slow but durable"
        - "Log the change first, sequentially, then apply it"
        - "Recovery means replaying the log"
    lines:
      - speaker: A
        kind: bridge
        text: "[warm] So: log it first, apply it later, replay it if things go wrong."
      - speaker: B
        kind: claim
        source: ch03-durability#p12
        text: "That's the contract. The next chapter is about what 'forced to disk' really means, because fsync is less reliable than it looks."
